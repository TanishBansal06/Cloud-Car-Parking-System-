server:
  port: 8080

spring:
  datasource:
    # --- Persistent Local File Database (Saves users & bookings permanently to disk across restarts) ---
    url: jdbc:h2:file:./data/cloud_parking_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

    # --- To use AWS RDS or Local MySQL, uncomment below and comment out H2 above ---
    # url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:cloud_parking_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    # username: ${DB_USER:root}
    # password: ${DB_PASSWORD:admin123}
    # driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
